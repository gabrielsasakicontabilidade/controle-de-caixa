<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar - Fluxo de Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  * { font-family:'Plus Jakarta Sans', Arial, sans-serif; }
  body { background:#EEF2EE; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .login-card { max-width:380px; width:100%; border:none; border-radius:15px; box-shadow:0 1px 3px rgba(0,0,0,.1), 0 1px 2px -1px rgba(0,0,0,.1); overflow:hidden; }
  .login-logo { padding:2rem 1.5rem 1rem; text-align:center; background:#fff; }
  .login-logo img { max-width:220px; width:100%; height:auto; }
  .login-subtitle { text-align:center; color:#5A7A65; font-weight:700; margin-bottom:1rem; }
  .login-footer { text-align:center; padding:0.75rem; font-size:0.75rem; color:#9AA79E; }
  .btn-success { background-color:#2D6A4F !important; border-color:#2D6A4F !important; }
  .form-control, .btn { border-radius:10px; }
</style>
</head>
<body>
<div class="card login-card">
  <div class="login-logo">
    <img src="{{ url_for('static', filename='logo-sasaki.png') }}" alt="Sasaki Solucoes Contabeis">
  </div>
  <div class="px-4 pb-4">
    <div class="login-subtitle">Fluxo de Caixa - Mercado</div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">Usuario</label>
        <input type="text" class="form-control" name="usuario" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Senha</label>
        <input type="password" class="form-control" name="senha" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Entrar</button>
    </form>
  </div>
  <div class="login-footer">Desenvolvido por Sasaki Solucoes Contabeis</div>
</div>
</body>
</html>
