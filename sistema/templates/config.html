{% extends "base.html" %}
{% block title %}Configuracoes{% endblock %}
{% block page_title %}Configuracoes{% endblock %}
{% block content %}
<div class="card p-4" style="max-width:500px;">
  <form method="post">
    <div class="mb-3">
      <label class="form-label">Saldo Inicial de Caixa (R$)</label>
      <input type="text" class="form-control" name="saldo_inicial" value="{{ cfg.saldo_inicial }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Data Inicial</label>
      <input type="date" class="form-control" name="data_inicial" value="{{ cfg.data_inicial.isoformat() }}">
    </div>
    <button type="submit" class="btn btn-success">Salvar</button>
  </form>
</div>
{% endblock %}
